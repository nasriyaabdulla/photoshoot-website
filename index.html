<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="#">MyWebsite</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#about">About Us</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>

            </ul>
        </div>
    </div>
</nav>


<!-- Home -->
<section id="home" class="home">
    <div class="container text-center">
        <h1>Welcome to My Website</h1>
        <p>This is my simple website using HTML, CSS, JavaScript and Bootstrap.</p>
        <button class="btn btn-primary" onclick="welcomeMessage()">
            Click Me
        </button>
    </div>
</section>


<!-- About Us -->
<section id="about" class="section">
    <div class="container text-center">
        <h2>About Us</h2>
        <p>
            We are a simple web development project.
            We create modern and user-friendly websites.
        </p>
    </div>
</section>


<!-- Contact -->
<section id="contact" class="section contact">
    <div class="container">
        <h2 class="text-center">Contact Us</h2>

        <form>
            <div class="mb-3">
                <label>Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label>Message</label>
                <textarea class="form-control" rows="4"
                          placeholder="Write your message"></textarea>
            </div>

            <button type="button" class="btn btn-success"
                    onclick="sendMessage()">
                Send Message
            </button>
        </form>
    </div>
</section>


<!-- Footer -->
<footer>
    <p>© 2026 MyWebsite. All Rights Reserved.</p>
</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- My JavaScript -->
<script src="script.js"></script>

</body>
</html>
